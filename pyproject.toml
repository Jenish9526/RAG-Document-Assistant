[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-document-assistant"
version = "1.0.0"
description = "Production-grade Retrieval-Augmented Generation (RAG) Document Assistant with multi-provider LLM support, FAISS vector search, and Streamlit UI."
readme = "README.md"
authors = [{ name = "Contributors" }]
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["rag", "ai", "llm", "faiss", "gemini", "groq", "embeddings", "streamlit", "nlp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "streamlit>=1.36.0",
    "pypdf>=4.2.0",
    "python-docx>=1.1.0",
    "sentence-transformers>=3.0.0",
    "faiss-cpu>=1.8.0",
    "numpy>=1.26.0",
    "python-dotenv>=1.0.1",
    "requests>=2.31.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [
    ".git",
    "__pycache__",
    "venv",
    ".venv",
    "vector_db",
    "data",
]
